name: Returner upgrade rehearsal
description: Fail a release when users who saved work on the previous build lose it on the new one. Kane CLI runs both builds in real Chrome at one origin.
branding:
  icon: rotate-ccw
  color: green
inputs:
  config:
    description: Optional JSON config file (returner.json). Explicit action inputs override config values.
    required: false
  old:
    description: Directory with the previous release's static build, or URL of a running app (required unless set in config).
    required: false
  new:
    description: Directory with the candidate release's static build, or URL of a running app (required unless set in config).
    required: false
  promise:
    description: What a returning user depends on, in plain English (required unless set in config).
    required: false
  seed:
    description: Kane objective that creates saved work on the old build. {title} and {body} are replaced with a random marker. Defaults to Returner's draft objective.
    required: false
  check:
    description: Kane objective the returning user must pass on the new build. Defaults to Returner's draft objective.
    required: false
  testmu-username:
    description: TestMu (LambdaTest) username. Pass it from a secret.
    required: true
  testmu-access-key:
    description: TestMu (LambdaTest) access key. Pass it from a secret.
    required: true
  expect:
    description: Verdict this job requires, pass (default) or fail. Use fail to demonstrate a known regression; an inconclusive run never satisfies either.
    default: pass
  kane-cli-version:
    description: kane-cli version to install.
    default: "0.10.6"
  artifact-name:
    description: Name of the uploaded report artifact. Override in matrix jobs or when running Returner twice in one job.
    required: false
  policy:
    description: Optional Kane CLI evidence policy YAML path to judge the merged rehearsal pack against.
    required: false
outputs:
  verdict:
    description: pass, fail (regression for returning users) or inconclusive.
    value: ${{ steps.rehearse.outputs.verdict }}
  report:
    description: Directory holding report.html and report.json.
    value: ${{ steps.rehearse.outputs.report }}
runs:
  using: composite
  steps:
    - name: Check inputs before spending Kane credits
      shell: bash
      env:
        EXPECT: ${{ inputs.expect }}
      run: |
        [ "$EXPECT" = pass ] || [ "$EXPECT" = fail ] || { echo "::error::expect must be pass or fail, got '$EXPECT'"; exit 1; }
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install and sign in to Kane CLI
      shell: bash
      env:
        LT_USERNAME: ${{ inputs.testmu-username }}
        LT_ACCESS_KEY: ${{ inputs.testmu-access-key }}
      run: |
        npm install -g "@testmuai/kane-cli@${{ inputs.kane-cli-version }}" --no-audit --no-fund --loglevel=error
        kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY" > /dev/null
    - name: Rehearse the upgrade with a new and a returning user
      id: rehearse
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        OLD: ${{ inputs.old }}
        NEW: ${{ inputs.new }}
        PROMISE: ${{ inputs.promise }}
        SEED: ${{ inputs.seed }}
        CHECK: ${{ inputs.check }}
        POLICY: ${{ inputs.policy }}
      run: |
        args=()
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        [ -n "$OLD" ] && args+=(--old "$OLD")
        [ -n "$NEW" ] && args+=(--new "$NEW")
        [ -n "$PROMISE" ] && args+=(--promise "$PROMISE")
        [ -n "$SEED" ] && args+=(--seed "$SEED")
        [ -n "$CHECK" ] && args+=(--check "$CHECK")
        [ -n "$POLICY" ] && args+=(--policy "$POLICY")
        set +e
        node "$GITHUB_ACTION_PATH/src/returner.mjs" "${args[@]}" | tee returner.log
        code=${PIPESTATUS[0]}
        set -e
        run=$(sed -n 's/^Evidence: //p' returner.log | head -1)
        rm -rf returner-report && mkdir -p returner-report
        [ -n "$run" ] && cp "$run"/report.html "$run"/report.json returner-report/ 2>/dev/null || true
        [ -n "$run" ] && [ -f "$run/rehearsal.evidence" ] && cp "$run/rehearsal.evidence" returner-report/ || true
        [ -n "$run" ] && [ -d "$run/rehearsal.evidence.verdicts" ] && cp -R "$run/rehearsal.evidence.verdicts" returner-report/ || true
        [ -n "$run" ] && [ -d "$run/shots" ] && cp -R "$run/shots" returner-report/ || true
        verdict=$([ "$code" = 0 ] && echo pass || ([ "$code" = 1 ] && echo fail || echo inconclusive))
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "report=$PWD/returner-report" >> "$GITHUB_OUTPUT"
        node "$GITHUB_ACTION_PATH/src/summary.mjs" returner-report/report.json "$verdict" >> "$GITHUB_STEP_SUMMARY" || true
        echo "$code" > returner-report/exit-code
    - name: Upload the report (never the browser profiles)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name || format('returner-report-{0}', github.job) }}
        path: returner-report
    - name: Require the expected verdict
      shell: bash
      env:
        EXPECT: ${{ inputs.expect }}
        VERDICT: ${{ steps.rehearse.outputs.verdict }}
      run: |
        echo "Returner verdict: $VERDICT (expected: $EXPECT)"
        [ "$VERDICT" = "$EXPECT" ]
